<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Route Management | SmartRoute</title><link rel="stylesheet" href="styles.css"></head><body data-page="routes"><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span> SmartRoute</div><nav><div class="nav-label">Workspace</div><a class="nav-link" data-page="dashboard" href="index.html"><span>▦</span> Dashboard</a><a class="nav-link" data-page="buses" href="buses.html"><span>◉</span> Bus tracking</a><a class="nav-link" data-page="attendance" href="attendance.html"><span>✓</span> Attendance</a><a class="nav-link active" data-page="routes" href="routes.html"><span>⌁</span> Route management</a><a class="nav-link" data-page="notifications" href="notifications.html"><span>♢</span> Notifications</a><div class="nav-label">School</div><a class="nav-link" data-page="parents" href="parents.html"><span>◎</span> Parents</a><a class="nav-link" data-page="admin" href="admin.html"><span>⚙</span> Settings</a></nav></aside><main class="content"><header class="topline"><div><p class="eyebrow">Operations / Planning</p><h1>Route management</h1></div><div class="top-actions"><div class="date-chip" data-today>Today</div><div class="avatar">AM</div></div></header><div class="grid-2"><section class="panel"><div class="panel-head"><div><h2>Active routes</h2><p class="panel-subtitle">Plan and assign the morning network</p></div></div><div class="route-list" id="routeList"></div></section><section class="panel"><div class="panel-head"><div><h2>Add a route</h2><p class="panel-subtitle">Create a route for the school day</p></div></div><form id="routeForm" class="form-grid"><label class="full">Route name<input name="name" placeholder="e.g. Riverside" required></label><label>Stops<input name="stops" type="number" min="1" placeholder="5" required></label><label>Departure<input name="time" type="time" required></label><label class="full">Assigned bus<select name="bus"><option>ST-204</option><option>ST-118</option><option>ST-307</option></select></label><button class="btn full" type="submit">Add route +</button></form></section></div></main></div><script src="app.js"></script><script>const routeList = document.querySelector('#routeList'); const routeForm = document.querySelector('#routeForm'); let routes = store.get('routes'); function drawRoutes() { routeList.innerHTML = routes.map(route => `<div class="route-item"><div class="route-icon">↗</div><div><strong>${route.name}</strong><div class="route-meta">${route.stops} stops · ${route.bus}</div></div><span class="status green">${route.time}</span></div>`).join(''); } routeForm.addEventListener('submit', event => { event.preventDefault(); const form = new FormData(routeForm); routes.push({ name: form.get('name'), stops: form.get('stops'), time: form.get('time'), bus: form.get('bus') }); store.set('routes', routes); routeForm.reset(); drawRoutes(); toast('New route added to the network'); }); drawRoutes();</script></body></html>
