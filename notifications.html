<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications | SmartRoute</title><link rel="stylesheet" href="styles.css"></head><body data-page="notifications"><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span> SmartRoute</div><nav><div class="nav-label">Workspace</div><a class="nav-link" data-page="dashboard" href="index.html"><span>▦</span> Dashboard</a><a class="nav-link" data-page="buses" href="buses.html"><span>◉</span> Bus tracking</a><a class="nav-link" data-page="attendance" href="attendance.html"><span>✓</span> Attendance</a><a class="nav-link" data-page="routes" href="routes.html"><span>⌁</span> Route management</a><a class="nav-link active" data-page="notifications" href="notifications.html"><span>♢</span> Notifications</a><div class="nav-label">School</div><a class="nav-link" data-page="parents" href="parents.html"><span>◎</span> Parents</a><a class="nav-link" data-page="admin" href="admin.html"><span>⚙</span> Settings</a></nav></aside><main class="content"><header class="topline"><div><p class="eyebrow">Communication / Parents</p><h1>Parent notifications</h1></div><div class="top-actions"><div class="date-chip" data-today>Today</div><div class="avatar">AM</div></div></header><div class="grid-2"><section class="panel"><div class="panel-head"><div><h2>Send an update</h2><p class="panel-subtitle">Reach families about transport changes</p></div></div><form id="notificationForm" class="form-grid"><label class="full">Audience<select name="audience"><option>All parents</option><option>North Loop parents</option><option>Coastline parents</option></select></label><label class="full">Subject<input name="title" placeholder="e.g. Route update" required></label><label class="full">Message<textarea name="text" placeholder="Write a clear update for parents..." required></textarea></label><button class="btn full" type="submit">Send notification →</button></form></section><section class="panel"><div class="panel-head"><div><h2>Sent recently</h2><p class="panel-subtitle">Your communication history</p></div></div><div class="route-list" id="notificationList"></div></section></div></main></div><script src="app.js"></script><script>const notificationList = document.querySelector('#notificationList'); const notificationForm = document.querySelector('#notificationForm'); let notifications = store.get('notifications'); function drawNotifications() { notificationList.innerHTML = notifications.map(item => `<div class="route-item"><div class="route-icon">✉</div><div><strong>${item.title}</strong><div class="route-meta">${item.text}</div></div><span class="status green">${item.time}</span></div>`).join(''); } notificationForm.addEventListener('submit', event => { event.preventDefault(); const form = new FormData(notificationForm); notifications.unshift({ title: form.get('title'), text: `${form.get('audience')}: ${form.get('text')}`, time: 'Just now', type: 'Update' }); store.set('notifications', notifications); notificationForm.reset(); drawNotifications(); toast('Notification sent to the selected parents'); }); drawNotifications();</script></body></html>
